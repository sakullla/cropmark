# 钉 macOS 部署目标:objc2/AppKit 壳与 ScreenCaptureKit 按 macOS 14 API 编译。
# cargo 从本目录向上发现此文件；tauri 在 src-tauri 内启动 cargo 时生效。
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# Release path sanitization. Build scripts and the release workflow export
# CROPMARK_REMAP_* before cargo/tauri build. Unset variables stay on the
# sentinel and match nothing, so dev/test builds are unchanged.
# More specific prefixes are last: rustc keeps the last matching prefix.
# On Windows release, scripts set CARGO_ENCODED_RUSTFLAGS (these flags plus
# the MSVC PDB alt path). That variable replaces this list, so keep the two
# copies in sync. Paths are separated by U+001F so spaces stay inside one flag.
[build]
rustflags = [
  "--remap-path-scope=all",
  "--remap-path-prefix=${CROPMARK_REMAP_HOME_VERBATIM:CROPMARK_REMAP_UNSET}=/home",
  "--remap-path-prefix=${CROPMARK_REMAP_HOME_ALT:CROPMARK_REMAP_UNSET}=/home",
  "--remap-path-prefix=${CROPMARK_REMAP_HOME:CROPMARK_REMAP_UNSET}=/home",
  "--remap-path-prefix=${CROPMARK_REMAP_RUSTUP_HOME_VERBATIM:CROPMARK_REMAP_UNSET}=/rustup",
  "--remap-path-prefix=${CROPMARK_REMAP_RUSTUP_HOME_ALT:CROPMARK_REMAP_UNSET}=/rustup",
  "--remap-path-prefix=${CROPMARK_REMAP_RUSTUP_HOME:CROPMARK_REMAP_UNSET}=/rustup",
  "--remap-path-prefix=${CROPMARK_REMAP_CARGO_HOME_VERBATIM:CROPMARK_REMAP_UNSET}=/cargo",
  "--remap-path-prefix=${CROPMARK_REMAP_CARGO_HOME_ALT:CROPMARK_REMAP_UNSET}=/cargo",
  "--remap-path-prefix=${CROPMARK_REMAP_CARGO_HOME:CROPMARK_REMAP_UNSET}=/cargo",
  "--remap-path-prefix=${CROPMARK_REMAP_REPO_VERBATIM:CROPMARK_REMAP_UNSET}=/cropmark",
  "--remap-path-prefix=${CROPMARK_REMAP_REPO_ALT:CROPMARK_REMAP_UNSET}=/cropmark",
  "--remap-path-prefix=${CROPMARK_REMAP_REPO:CROPMARK_REMAP_UNSET}=/cropmark",
]
