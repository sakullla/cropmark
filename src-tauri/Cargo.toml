[package]
name = "cropmark"
version = "0.1.3"
description = "Cropmark screenshot tool"
authors = ["Cropmark"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cropmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
paddle-ocr-rs = "0.6.1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "download-binaries", "copy-dylibs"] }
ndarray = "0.16"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1.3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pollster = "0.4"
url = "2"
x11rb = { version = "0.13", features = ["randr"] }

# Keep the app debuggable without running full-resolution image codecs unoptimized.
[profile.dev.package.cropmark]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3
