[package]
name = "cropmark"
version = "0.3.7"
description = "Cropmark screenshot tool"
authors = ["Cropmark"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cropmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# R3:WebP 有损导出(image-webp 编码器仅支持无损,质量档位不可观察文件大小变化)。
webp = { version = "0.3.1", default-features = false }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
paddle-ocr-rs = "0.6.1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "download-binaries", "copy-dylibs"] }
ndarray = "0.16"
# R16:结构化日志、有界轮转，以及从设置/帮助打开日志目录。
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1.3"
# 单实例(single_instance/unix.rs):flock 锁文件与 uid 派生实例名。
libc = "0.2"
# 区域选区壳(macos.rs):无边框 NSWindow + CG 位图呈现 + NSEvent 转发。
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSCursor",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSPanel",
  "NSResponder",
  "NSScreen",
  "NSTextInputClient",
  "NSView",
  "NSWindow",
  "block2",
] }
block2 = "0.6"
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes", "CFRunLoop", "block2"] }
objc2-core-graphics = { version = "0.3.2", features = [
  "CGColorSpace",
  "CGContext",
  "CGDataProvider",
  "CGImage",
  "CGWindowLevel",
] }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSDate",
  "NSGeometry",
  "NSLocale",
  "NSObjCRuntime",
  "NSRunLoop",
  "NSString",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pollster = "0.4"
url = "2"
# 区域选区壳(selection/shell/linux.rs):X11 override-redirect 窗 +
# MIT-SHM/XPutImage 呈现;libc 用于共享内存段(shmget/shmat)。
x11rb = { version = "0.13", features = ["randr", "shm"] }
libc = "0.2"

# Keep the app debuggable without running full-resolution image codecs unoptimized.
[profile.dev.package.cropmark]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

# Tauri size guide: one codegen unit, fat LTO, strip symbols.
# opt-level stays at the default 3 so image encode/decode does not slow down.
# panic stays unwind: tray, OCR, and the macOS selection shell recover with
# catch_unwind. abort would skip that recovery. The panic hook still writes
# crash.log on both caught and uncaught panics.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
