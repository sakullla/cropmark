[package]
name = "cropmark"
version = "0.2.4"
description = "Cropmark screenshot tool"
authors = ["Cropmark"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cropmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
paddle-ocr-rs = "0.6.1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "download-binaries", "copy-dylibs"] }
ndarray = "0.16"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1.3"
# 区域选区壳(macos.rs):无边框 NSWindow + CG 位图呈现 + NSEvent 转发。
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSCursor",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSPanel",
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = [
  "CGColorSpace",
  "CGContext",
  "CGDataProvider",
  "CGImage",
  "CGWindowLevel",
] }
objc2-foundation = { version = "0.3.2", features = [
  "NSDate",
  "NSGeometry",
  "NSObjCRuntime",
  "NSRunLoop",
  "NSString",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pollster = "0.4"
url = "2"
# 区域选区壳(selection/shell/linux.rs):X11 override-redirect 窗 +
# MIT-SHM/XPutImage 呈现;libc 用于共享内存段(shmget/shmat)。
x11rb = { version = "0.13", features = ["randr", "shm"] }
libc = "0.2"

# Keep the app debuggable without running full-resolution image codecs unoptimized.
[profile.dev.package.cropmark]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3
