name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and release checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check release metadata and offline models
        run: node .github/scripts/release.mjs check
      - name: Test release guards
        run: node --test .github/scripts/release.test.mjs
      - name: Build frontend
        run: npm run build

  rust:
    name: Rust tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            os: windows-latest
          - platform: macOS ARM64
            os: macos-latest
          - platform: Linux x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # Existing platform-specific dead code and style warnings are not errors.
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets
