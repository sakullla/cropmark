name: Cropmark packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: pwsh -File scripts/build-windows.ps1
            artifact: Cropmark-windows
            path: src-tauri/target/release/bundle/nsis/*
          - name: macOS
            os: macos-latest
            script: bash scripts/build-macos.sh
            artifact: Cropmark-macos
            path: |
              src-tauri/target/release/bundle/dmg/*
              src-tauri/target/release/bundle/macos/*
          - name: Linux
            os: ubuntu-22.04
            script: bash scripts/build-linux.sh
            artifact: Cropmark-linux
            path: |
              src-tauri/target/release/bundle/appimage/*
              src-tauri/target/release/bundle/deb/*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Cropmark
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
