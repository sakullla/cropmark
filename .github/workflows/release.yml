name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate tag and generate changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/release.mjs check "$RELEASE_TAG"
          node .github/scripts/release.mjs notes "$RELEASE_TAG" > release-notes.md
      - name: Create or resume draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp \
            | jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first')
          endpoint="repos/$GITHUB_REPOSITORY/releases"
          method=POST
          if [[ "$release" != null ]]; then
            if [[ $(jq -r '.draft' <<< "$release") != true ]]; then
              echo "::error::Release is already published; use a new version tag."
              exit 1
            fi
            endpoint="$endpoint/$(jq -r '.id' <<< "$release")"
            method=PATCH
          fi
          release_id=$(gh api --method "$method" "$endpoint" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="Cropmark $RELEASE_TAG" -F body=@release-notes.md \
            -F draft=true -F prerelease="$PRERELEASE" --jq '.id')
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            platform: macOS ARM64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            platform: Linux x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
          cache-on-failure: true
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Prefixes are read by src-tauri/.cargo/config.toml. Windows also sets
      # RUSTFLAGS because that replaces config rustflags.
      - name: Remap host paths out of release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -RemapOnly
      - name: Remap host paths out of release binaries
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build-macos.sh --remap-only
      - name: Remap host paths out of release binaries
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-linux.sh --remap-only
      - name: Require stable macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "${APPLE_CERTIFICATE}"
          test -n "${APPLE_CERTIFICATE_PASSWORD}"
          test -n "${APPLE_SIGNING_IDENTITY}"
      - name: Build and upload to draft release
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          retryAttempts: 2
          # latest.json is written after the NSIS, AppImage, and macOS signatures all exist.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --verbose -- --locked
      - name: Build and sign macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # CI=true 时 Tauri 会加 --skip-jenkins，跳过安装页的窗口大小和图标位置。
          export TAURI_BUNDLER_DMG_IGNORE_CI=true
          env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD -u APPLE_SIGNING_IDENTITY \
            npm run tauri -- build --target "$TARGET" --bundles dmg --no-sign -- --locked
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          arch="${TARGET%%-*}"
          dmg="src-tauri/target/$TARGET/release/bundle/dmg/Cropmark_${version}_${arch}.dmg"
          test -f "$dmg"
          keychain="$RUNNER_TEMP/cropmark.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          base64 --decode > "$RUNNER_TEMP/cropmark.p12" <<< "${APPLE_CERTIFICATE}"
          security import "$RUNNER_TEMP/cropmark.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          rw="$RUNNER_TEMP/cropmark-rw.dmg"
          rm -f "$rw"
          hdiutil convert "$dmg" -format UDRW -o "$rw"
          # Reserve room to replace the ad-hoc signed app with the certificate-signed app.
          rw_size_mib=$(( ($(stat -f %z "$rw") + 1048575) / 1048576 + 64 ))
          hdiutil resize -size "${rw_size_mib}m" "$rw"
          mount="$RUNNER_TEMP/cropmark-mnt"
          rm -rf "$mount"
          mkdir -p "$mount"
          hdiutil attach "$rw" -readwrite -mountpoint "$mount" -nobrowse -noverify -noautoopen
          app="$mount/Cropmark.app"
          test -d "$app"
          test -L "$mount/Applications"
          signing_app="$RUNNER_TEMP/Cropmark.app"
          rm -rf "$signing_app"
          ditto "$app" "$signing_app"
          # Sign on the runner filesystem, then replace the app in the image.
          # Sign nested Mach-O files before the app; --deep can break their signatures.
          find "$signing_app" -type f -print0 | while IFS= read -r -d '' bin; do
            if file -b "$bin" | grep -q 'Mach-O'; then
              printf '%s\n' "$bin"
            fi
          done | awk '{ print length($0) "\t" $0 }' | sort -nr | cut -f2- | while IFS= read -r bin; do
            codesign --force --options runtime --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          done
          codesign --force --options runtime --entitlements src-tauri/entitlements.plist --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$signing_app"
          codesign --verify --deep --strict --verbose=2 "$signing_app"
          rm -rf "$app"
          ditto "$signing_app" "$app"
          rm -f "$RUNNER_TEMP/cropmark.p12"
          hdiutil detach "$mount"
          rm -f "$dmg"
          hdiutil convert "$rw" -format UDZO -o "$dmg"
          security delete-keychain "$keychain"
          # Updater archive is the re-signed .app, not the ad-hoc build inside the image.
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          updater_dir="src-tauri/target/$TARGET/release/bundle/macos"
          mkdir -p "$updater_dir"
          updater_tgz="$updater_dir/Cropmark_${version}_${arch}.app.tar.gz"
          tar -czf "$updater_tgz" -C "$RUNNER_TEMP" Cropmark.app
          npm run tauri -- signer sign "$updater_tgz" --app-version "$version"
          test -s "$updater_tgz"
          test -s "$updater_tgz.sig"
      - name: Verify macOS self-signed signature
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          arch="${TARGET%%-*}"
          dmg="src-tauri/target/$TARGET/release/bundle/dmg/Cropmark_${version}_${arch}.dmg"
          test -f "$dmg"
          mount="$RUNNER_TEMP/cropmark-verify"
          rm -rf "$mount"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -noverify -noautoopen
          app="$mount/Cropmark.app"
          test -d "$app"
          test -n "${APPLE_SIGNING_IDENTITY}"
          signature=$(codesign --display --verbose=4 "$app" 2>&1)
          echo "$signature"
          if grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "release app is ad-hoc; expected ${APPLE_SIGNING_IDENTITY}" >&2
            exit 1
          fi
          grep -F -x -q "Authority=${APPLE_SIGNING_IDENTITY}" <<< "$signature"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil detach "$mount"
      - name: Upload verified macOS disk image
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          arch="${TARGET%%-*}"
          dmg="src-tauri/target/$TARGET/release/bundle/dmg/Cropmark_${version}_${arch}.dmg"
          updater_tgz="src-tauri/target/$TARGET/release/bundle/macos/Cropmark_${version}_${arch}.app.tar.gz"
          test -s "$updater_tgz"
          test -s "$updater_tgz.sig"
          gh release upload "$RELEASE_TAG" "$dmg" "$updater_tgz" "$updater_tgz.sig" --clobber

  verify-release:
    name: Verify release assets and publish
    needs: [validate, prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require all platform installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          node .github/scripts/release.mjs verify release.json "$RELEASE_TAG"
      - name: Generate and upload updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          work="$RUNNER_TEMP/updater-manifest"
          mkdir -p "$work"
          gh release download "$RELEASE_TAG" --pattern "*.sig" --dir "$work" --clobber
          win_sig="$work/Cropmark_${version}_x64-setup.exe.sig"
          linux_sig="$work/Cropmark_${version}_amd64.AppImage.sig"
          mac_sig="$work/Cropmark_${version}_aarch64.app.tar.gz.sig"
          for file in "$win_sig" "$linux_sig" "$mac_sig"; do
            test -s "$file"
          done
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$(cat "$win_sig")" \
            --arg win_url "$base/Cropmark_${version}_x64-setup.exe" \
            --arg linux_sig "$(cat "$linux_sig")" \
            --arg linux_url "$base/Cropmark_${version}_amd64.AppImage" \
            --arg mac_sig "$(cat "$mac_sig")" \
            --arg mac_url "$base/Cropmark_${version}_aarch64.app.tar.gz" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "windows-x86_64-nsis": { signature: $win_sig, url: $win_url },
                "linux-x86_64": { signature: $linux_sig, url: $linux_url },
                "linux-x86_64-appimage": { signature: $linux_sig, url: $linux_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-aarch64-app": { signature: $mac_sig, url: $mac_url }
              }
            }' > "$work/latest.json"
          gh release upload "$RELEASE_TAG" "$work/latest.json" --clobber
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false --jq '.html_url'
