name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare draft release
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate tag and generate changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/release.mjs check "$RELEASE_TAG"
          node .github/scripts/release.mjs notes "$RELEASE_TAG" > release-notes.md
      - name: Create or resume draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp \
            | jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first')
          endpoint="repos/$GITHUB_REPOSITORY/releases"
          method=POST
          if [[ "$release" != null ]]; then
            if [[ $(jq -r '.draft' <<< "$release") != true ]]; then
              echo "::error::Release is already published; use a new version tag."
              exit 1
            fi
            endpoint="$endpoint/$(jq -r '.id' <<< "$release")"
            method=PATCH
          fi
          release_id=$(gh api --method "$method" "$endpoint" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="Cropmark $RELEASE_TAG" -F body=@release-notes.md \
            -F draft=true -F prerelease="$PRERELEASE" --jq '.id')
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            platform: macOS ARM64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            platform: Linux x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
          cache-on-failure: true
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Require stable macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "${APPLE_CERTIFICATE}"
          test -n "${APPLE_CERTIFICATE_PASSWORD}"
          test -n "${APPLE_SIGNING_IDENTITY}"
      - name: Build and upload to draft release
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          retryAttempts: 2
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --verbose -- --locked
      - name: Build, sign, and upload macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm run tauri -- build --target "$TARGET" --bundles app -- --locked
          app="src-tauri/target/$TARGET/release/bundle/macos/Cropmark.app"
          test -d "$app"
          keychain="$RUNNER_TEMP/cropmark.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          base64 --decode > "$RUNNER_TEMP/cropmark.p12" <<< "${APPLE_CERTIFICATE}"
          security import "$RUNNER_TEMP/cropmark.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          codesign --force --deep --options runtime --entitlements src-tauri/entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" "$app"
          rm -f "$RUNNER_TEMP/cropmark.p12"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          arch="${TARGET%%-*}"
          dmg="$RUNNER_TEMP/Cropmark_${version}_${arch}.dmg"
          hdiutil create -volname Cropmark -srcfolder "$app" -ov -format UDZO "$dmg"
          gh release upload "${{ github.ref_name }}" "$dmg" --clobber
          security delete-keychain "$keychain"
      - name: Verify macOS self-signed signature
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app="src-tauri/target/$TARGET/release/bundle/macos/Cropmark.app"
          test -d "$app"
          test -n "${APPLE_SIGNING_IDENTITY}"
          signature=$(codesign --display --verbose=4 "$app" 2>&1)
          echo "$signature"
          if grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "release app is ad-hoc; expected ${APPLE_SIGNING_IDENTITY}" >&2
            exit 1
          fi
          grep -F -x -q "Authority=${APPLE_SIGNING_IDENTITY}" <<< "$signature"
          codesign --verify --deep --strict --verbose=2 "$app"

  verify-release:
    name: Verify release assets and publish
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require all platform installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          node .github/scripts/release.mjs verify release.json "$RELEASE_TAG"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false --jq '.html_url'
